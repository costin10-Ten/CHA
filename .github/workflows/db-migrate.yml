name: Supabase Migrations

# 讓 migration 完全在網頁上完成：不需要在本機安裝 Supabase CLI 或 clone repo。
#
# 觸發時機：
#   1. push 到 main 或開發分支且 supabase/migrations/ 有變動
#   2. 在 GitHub → Actions → Supabase Migrations → Run workflow 手動執行
#
# 需要三個 Repository Secret（Settings → Secrets and variables → Actions）：
#   SUPABASE_ACCESS_TOKEN  個人存取權杖 https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    專案 ref，即 https://<ref>.supabase.co 的 <ref>
#   SUPABASE_DB_PASSWORD   建立專案時設定的資料庫密碼
#
# 註：本專案為單人、單一 Supabase 專案，開發分支也允許套用 migration，
# 這樣 Vercel Preview 才有對應的資料表可驗證。

on:
  push:
    branches: [main, develop, "claude/**", "feature/**"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Repository Secret:$missing"
            echo "請到 Settings → Secrets and variables → Actions 新增後重新執行。"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Verify
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
