name: Supabase Migrations

# 讓 migration 完全在網頁上完成：不需要在本機安裝 Supabase CLI 或 clone repo。
#
# 觸發時機：
#   1. push 到 main 且 supabase/migrations/ 或 supabase/functions/ 有變動
#   2. 在 GitHub → Actions → Supabase Migrations → Run workflow 手動執行
#
# 需要三個 Repository Secret（Settings → Secrets and variables → Actions）：
#   SUPABASE_ACCESS_TOKEN  個人存取權杖 https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    專案 ref，即 https://<ref>.supabase.co 的 <ref>
#   SUPABASE_DB_PASSWORD   建立專案時設定的資料庫密碼
#
# 只從 main 觸發，理由是 Vercel 的 production 也只部署 main：
# 結構與程式必須一起上線。
#
# 曾經開放 claude/** 觸發，結果 migration 先套用、app 還是舊版，
# 一個把欄位改名的 migration 讓線上所有匯入都失敗
# （欄位沒了，舊程式還在寫它），而且要看 GitHub Actions 才查得出原因。
#
# 因此改結構時的規矩是：
#   加法式（新增資料表／欄位）→ 直接寫，合併後才生效，不會影響舊版
#   破壞式（drop／rename 欄位）→ 拆兩步：先加新欄位並讓程式同時支援兩者，
#                                 合併上線後，下一個 migration 才移除舊欄位
#
# 要在 Preview 上驗證新結構時，用 workflow_dispatch 手動跑。

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Repository Secret:$missing"
            echo "請到 Settings → Secrets and variables → Actions 新增後重新執行。"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Verify
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      # Edge Functions 與 migration 一起部署，資料表與 worker 版本才會一致。
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
